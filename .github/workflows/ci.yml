name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CJK fonts for PNG export
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-list :lang=zh | head -n 3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Reject secrets and runtime artifacts
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|env\.env|\.venv|venv|__pycache__|cache|recommendations)(/|$)|\.py[co]$'; then
            echo "::error::Tracked secrets or runtime artifacts were found."
            exit 1
          fi

      - name: Compile Python sources
        run: python -m compileall -q astock app.py

      - name: Lint and type-check
        run: |
          python -m pip install ruff mypy
          ruff check astock app.py tests --select E9,F63,F7,F82
          mypy astock app.py

      - name: Run tests with coverage gate (50%)
        run: |
          python -m pip install -r requirements-dev.txt
          # 固定用 pytest 并显式传 tests：直接 pytest 会连同 release/AStockAgent/tests 重复收集。
          coverage run -m pytest tests -q
          coverage report -m --fail-under=50

  # 真实 PNG 导出（非 monkeypatch）：独立 job，失败/超时单独可见，不拖垮主测试流水线。
  # 依赖 Windows 开发机同款组合：plotly/kaleido 由 requirements.txt 锁版本，
  # Chrome 用 ubuntu-latest 预装版本，中文字体用 fonts-noto-cjk（见 docs/AStockAgent_png_export_ops.md）。
  png-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CJK fonts for PNG export
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          count=$(fc-list :lang=zh | wc -l)
          echo "cjk_fonts=$count"
          test "$count" -gt 0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Locate Chrome for kaleido 1.x
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "系统无 Chrome，使用 kaleido 自带下载器兜底"
            python -c "import kaleido; kaleido.get_chrome_sync()"
            chrome="$(python -c 'from choreographer.browsers import Chromium; print(Chromium.find_browser(skip_local=False) or "")')"
          fi
          "$chrome" --version
          echo "ASTOCK_CHROME_VERSION=$("$chrome" --version | awk '{print $3}')" >> "$GITHUB_ENV"

      - name: Show PNG toolchain versions
        run: |
          python - <<'PY'
          from importlib.metadata import version
          print("plotly", version("plotly"))
          print("kaleido", version("kaleido"))
          PY
          fc-list :lang=zh | head -n 3

      - name: Real PNG export tests (Chinese candlestick, no monkeypatch)
        env:
          ASTOCK_REQUIRE_CJK: "1"
          ASTOCK_PNG_SAMPLE_DIR: ${{ github.workspace }}/png-artifacts
        run: |
          mkdir -p png-artifacts
          python -m pytest tests/test_agent_chart_png_export.py tests/test_agent_chart_png_zh.py -q --timeout=180

      - name: Upload PNG artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chart-png
          path: png-artifacts/**/*.png
          if-no-files-found: warn
          retention-days: 14
