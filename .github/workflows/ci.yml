name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          # 两个文件都参与缓存键：只改 dev 依赖也必须让缓存失效，否则工具版本会被旧缓存盖住。
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # 防止误把 release/AStockAgent 旧仓库当发布源，或把 remote 指向 fork/旧地址。
      # push/main 与 workflow_dispatch 严格校验 main；PR 的 GitHub Actions checkout 是 detached HEAD。
      - name: Verify repository source of truth
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python tools/check_repo_source.py --any-branch --allow-detached
          else
            python tools/check_repo_source.py
          fi

      # 一次装齐运行时 + 工具链。工具版本由 requirements-dev.txt 精确锁定
      # （ruff==0.17.3 / mypy==2.4.1 / coverage==7.17.0 / pytest==9.2.0），
      # 不再 `pip install ruff mypy` 裸装最新版——2026-11-16 的 main 跑出了
      # ruff 0.17.5 / coverage 7.17.3，与本地实测版本不一致，导致结论无法归因。
      - name: Install dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Reject secrets and runtime artifacts
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|env\.env|\.venv|venv|__pycache__|cache|recommendations)(/|$)|\.py[co]$'; then
            echo "::error::Tracked secrets or runtime artifacts were found."
            exit 1
          fi

      - name: Compile Python sources
        run: python -m compileall -q astock app.py

      # 全仓静态检查：astock + tests 全量 blocking（规则清单见 ruff.toml 的显式 select）。
      # PR 与 main 都跑，规则集/工具版本任一变化都会在 CI 里暴露。
      # app.py 是仓库根历史原型脚本，已在 ruff.toml 里 exclude，见该文件注释（P3 单独清理）。
      - name: Lint and type-check (ruff + mypy, blocking)
        run: |
          ruff --version
          mypy --version
          ruff check astock tests
          mypy astock app.py

      # 覆盖率门槛来自 .coveragerc（fail_under），这里不再重复 --fail-under，避免两处数字打架。
      # 分阶段目标：P2（当前）80.56%（=CI Linux 实测显示值 / 本地 Windows 80.80%）→ P3 85%。
      # 原 P1 目标 80% 已随 2026-11-27 实测（run 46047574586）达成，不再是下一步门槛。
      # 提升路径见 .coveragerc 注释；每次上调都在 PR 里附 coverage report 的 Missing 列。
      - name: Run tests with coverage gate (current 80.56% → P3 85%; P1 80% achieved)
        run: |
          # 显式传 tests，避免收集非测试目录；release/ 已忽略且不再是发布源。
          # 真实 PNG 导出（marker=png）需要 Chrome/字体，只在独立 png-export job 里跑，
          # 不让宿主环境抖动拖红主流水线（评审 P1）。
          coverage run -m pytest tests -q -m "not png"
          coverage report -m

      # 20 条 FakeModel + 固定工具桩离线评测；显式加载仓库 baseline，
      # 防止“测试只和自己比”导致回归门槛失效（review iss-mwtakt0o-5897b8）。
      - name: Agent offline eval baseline gate
        run: |
          python -m astock.agent.evals \
            --tasks .devloop/evals/agent_eval_tasks.json \
            --output "$RUNNER_TEMP/agent_eval.json" \
            --baseline .devloop/evals/agent_eval_baseline.json

  # 真实 PNG 导出（非 monkeypatch）：独立 job，失败/超时单独可见，不拖垮主测试流水线。
  # 依赖 Windows 开发机同款组合：plotly/kaleido 由 requirements.txt 锁版本，
  # Chrome 用 ubuntu-latest 预装版本，中文字体用 fonts-noto-cjk（见 docs/AStockAgent_png_export_ops.md）。
  png-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install CJK fonts for PNG export
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          count=$(fc-list :lang=zh | wc -l)
          echo "cjk_fonts=$count"
          test "$count" -gt 0

      - name: Install dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Locate Chrome for kaleido 1.x
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "系统无 Chrome，使用 kaleido 自带下载器兜底"
            python -c "import kaleido; kaleido.get_chrome_sync()"
            chrome="$(python -c 'from choreographer.browsers import Chromium; print(Chromium.find_browser(skip_local=False) or "")')"
          fi
          "$chrome" --version
          echo "ASTOCK_CHROME_VERSION=$("$chrome" --version | awk '{print $3}')" >> "$GITHUB_ENV"

      - name: Show PNG toolchain versions
        run: |
          python - <<'PY'
          from importlib.metadata import version
          print("plotly", version("plotly"))
          print("kaleido", version("kaleido"))
          PY
          fc-list :lang=zh | head -n 3

      - name: Real PNG export tests (Chinese candlestick, no monkeypatch)
        env:
          ASTOCK_REQUIRE_CJK: "1"
          ASTOCK_PNG_SAMPLE_DIR: ${{ github.workspace }}/png-artifacts
        run: |
          mkdir -p png-artifacts
          python -m pytest tests/test_agent_chart_png_export.py tests/test_agent_chart_png_zh.py tests/test_agent_tools.py -q -m png --timeout=180

      - name: Upload PNG artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chart-png
          path: png-artifacts/**/*.png
          if-no-files-found: warn
          retention-days: 14
