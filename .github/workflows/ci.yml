name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Reject secrets and runtime artifacts
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|env\.env|\.venv|venv|__pycache__|cache|recommendations)(/|$)|\.py[co]$'; then
            echo "::error::Tracked secrets or runtime artifacts were found."
            exit 1
          fi

      - name: Compile Python sources
        run: python -m compileall -q astock app.py

      - name: Lint and type-check
        run: |
          python -m pip install ruff mypy
          ruff check astock app.py tests --select E9,F63,F7,F82
          mypy astock app.py

      - name: Run tests with coverage gate (50%)
        run: |
          python -m pip install -r requirements-dev.txt
          # 固定用 pytest 并显式传 tests：直接 pytest 会连同 release/AStockAgent/tests 重复收集。
          coverage run -m pytest tests -q
          coverage report -m --fail-under=50
