name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Reject secrets and runtime artifacts
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|env\.env|\.venv|venv|__pycache__|cache|recommendations)(/|$)|\.py[co]$'; then
            echo "::error::Tracked secrets or runtime artifacts were found."
            exit 1
          fi

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
