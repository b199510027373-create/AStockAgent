# 显式 Ruff 基线（plan-20261103-012）。
#
# 为什么不用 Ruff 默认规则集：默认集会随 Ruff 版本变化，CI 升级工具就可能凭空多出一批
# 与本次改动无关的报错。这里的 select/ignore 是冻结的规则清单，升级 Ruff 时必须显式改本文件，
# 让「规则变化」和「代码变化」分开评审。版本固定在 requirements-dev.txt（ruff==<pin>）。
#
# 分阶段策略：
#   P1（plan-20261103-012）：上述清单归零 + CI blocking；astock/scheduler.py 与 astock/jobs.py
#              因 PR #9 五日观察（至 2026-11-21）暂缓清理，只在 per-file-ignores 里豁免既有问题。
#   P2（plan-20261117-001，观察期结束后）：已删除那两条 per-file-ignores，并清理
#              scheduler/jobs 的 23 条存量（ruff 实测；任务描述记的 22 条为估算）：
#              能收窄到具体异常的已收窄，try/except/pass 改为 contextlib.suppress，
#              其余真正的边界兜底保留 `# noqa: BLE001 - 理由`。现在没有任何文件级豁免。
#   P3：逐族开启 RUF001/RUF002/RUF003（中文全角标点）与 B905（zip strict），先评估再决定。
#
# 盲捕异常策略（OPS-01 调度边界）：BLE001 只允许出现在「任何异常都不能让调度线程退出 /
# 不能让状态机失真」的兜底处，且必须写理由；纯解析类代码（int()/json.loads/
# fromisoformat）一律收窄到 ValueError/TypeError/OSError，不得用 Exception 兜。
# tests/test_ci_quality_gates.py::test_blind_except_exemptions_carry_reasons 守护这条约定。
target-version = "py313"
line-length = 120
# app.py 是仓库根的历史原型脚本（单文件 Streamlit/Gradio 试作，113 条 E402/E701/E702 等），
# 不属于 astock 包，也不在本次实测基线（astock 264 + tests 56）与验收命令
# `ruff check astock tests` 的范围内。这里显式排除，避免本地随手 `ruff check .`
# 与 CI 结论不一致；该文件的清理单独排期（P3），清理前不做任何行为改动。
exclude = ["app.py"]
# 本地复核提示：Ruff 的 isort 会把仓库根下「同名顶层目录」自动当成 first-party。
# 本机跑测试时 Gradio 会在仓库根生成 `gradio/`（内含 vibe_edit_history），
# 于是 `import gradio as gr` 被误判为 first-party，本地 I001 报 9 条而 CI（干净检出）全绿。
# 该目录已加入 .gitignore；下面的 [lint.isort] 再把 gradio 钉死为第三方，
# 使本地与 CI 的判定完全一致（CI 首轮红灯就是这个假阳性导致的）。

[lint]
# 显式选择规则族 + 少量单条规则；不接受默认集。
select = [
    "E4",      # import 语法
    "E7",      # 语句级语法
    "E9",      # 运行时错误（未定义名等）
    "F",       # pyflakes
    "I",       # import 排序
    "B",       # bugbear
    "C4",      # 推导式
    "SIM",     # 可简化写法
    "UP",      # pyupgrade
    "RUF",     # ruff 自有规则
    "PIE",     # flake8-pie
    "FURB",    # refurb
    "PLR0402", # 手工 from-import
    "PLR0124", # 与自身比较
    "PLR1716", # 链式比较
    "PLW0127", # 自赋值
    "S110",    # try-except-pass（验收要求逐条给理由）
    "S112",    # try-except-continue（验收要求逐条给理由）
    "BLE",     # 盲捕异常（验收要求逐条审计）
    "ISC",     # 隐式字符串拼接（验收要求手工处理）
    "TRY004",  # 类型检查未抛 TypeError
]
ignore = [
    # 中文注释/文档字符串里的全角标点会被判为「易混淆 Unicode」。本项目注释就是中文，
    # 该规则只会制造噪声；若要启用需先统一改写注释，放到 P3 评估。
    "RUF001",
    "RUF002",
    "RUF003",
    # zip 不写 strict 在现有数据管道里是刻意行为（长度由上游断言保证），
    # 逐处补 strict 属于行为变更，单独排期。
    "B905",
]

[lint.isort]
known-first-party = ["astock"]
# 固定 gradio 为第三方：仓库根可能被测试生成同名 `gradio/` 目录，不钉死则本地与 CI 的
# I001 结论不一致（见文件头说明）。
known-third-party = ["gradio"]

